<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>إدڤيا | نسخة العرض التجريبية</title>
<script>
  // A page address typed without "#" (e.g. .../admin/dashboard) opens the same page of the demo:
  // find the demo's folder (the nearest one that has data/accounts.json), then go to its hash route.
  (async function () {
    var parts = location.pathname.split("/").filter(Boolean);
    for (var keep = parts.length - 1; keep >= 0; keep--) {
      var base = "/" + parts.slice(0, keep).join("/") + (keep ? "/" : "");
      try {
        var probe = await fetch(base + "data/accounts.json", { method: "HEAD", cache: "no-store" });
        if (probe.ok) {
          var route = "/" + parts.slice(keep).map(decodeURIComponent).join("/");
          location.replace(location.origin + base + "#" + route + location.search);
          return;
        }
      } catch (error) {
        /* try a shorter folder */
      }
    }
    location.replace(location.origin + "/");
  })();
</script>
</head>
<body></body>
</html>
